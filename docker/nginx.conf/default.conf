server {
    listen 80;
    server_name api.sig.systems _;

    # Upstream resuelto por petición (resolver de Docker + variable): nginx arranca
    # aunque `web` no exista todavía y toma su nueva IP si el contenedor se recrea.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django_upstream http://web:8000;

    client_max_body_size 50M;  # admite uploads de planos indoor (ver SiteIndoorMapUploadSerializer)

    # Media — archivos subidos (planos indoor), servidos desde el volumen media_data
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API — incluye SSE/streaming sin buffering
    location /api/ {
        proxy_pass         $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400;
    }

    # Auth
    location /web-auth/ {
        proxy_pass         $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
