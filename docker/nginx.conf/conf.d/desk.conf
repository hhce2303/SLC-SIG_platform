# ─────────────────────────────────────────────────────────────
#  Vhost de SIG-Desk en el nginx de borde (dueño: equipo SIG-Desk).
#  Montado por docker/docker-compose.sigdesk.yml en /etc/nginx/conf.d/desk.conf.
#  Contrato: docs/EDGE_CONTRACT.md
#
#    desk.sig.systems/desk-api/*  → sigdesk-kong:8000 (sin el prefijo)
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name desk.sig.systems;

    client_max_body_size 50M;

    # Resolver embebido de Docker; el upstream se resuelve por petición, así que
    # nginx arranca aunque sigdesk-kong no exista. Kong caído = 502 solo aquí.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API de SIG-Desk (Kong). Kong expone rutas sin prefijo (/tickets, /me, ...)
    # → se retira /desk-api/ antes de reenviar.
    location /desk-api/ {
        set $desk_kong http://sigdesk-kong:8000;
        rewrite            ^/desk-api/(.*)$ /$1 break;
        proxy_pass         $desk_kong;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400;
    }

    location / {
        return 404;
    }
}
