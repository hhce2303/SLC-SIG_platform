# ─────────────────────────────────────────────────────────────
#  SIG Platform — overlay: SIGDesk comparte la entrada/salida web
#
#  El nginx de la plataforma (SIGplatform-nginx, puerto ${NGINX_PORT:-8091})
#  pasa a ser también la entrada/salida web de la API de SIGDesk. Lo hace
#  con un segundo virtual host (server_name desk.sig.systems) que convive
#  con el default.conf de la plataforma SIN modificarlo:
#
#    desk.sig.systems:8091/desk-api/*  → Kong de SIGDesk (sigdesk-kong, sin el prefijo)
#
#  El frontend de SIGDesk se despliega aparte; como su origen es distinto,
#  ese origen debe estar en el plugin cors de SIG-Desk-Backend/kong.yml.
#  api.sig.systems sigue atendido por default.conf igual que antes.
#
#  Requisitos:
#    1. DNS / hosts:  desk.sig.systems → la IP del servidor.
#    2. Red compartida, una sola vez:  docker network create sig-edge
#    3. Kong de SIGDesk se une a esa red con
#       SIG-Desk/SIG-Desk-Backend/compose.edge.yaml.
#
#  Uso:
#    docker compose -f docker/docker-compose.yml \
#                   -f docker/docker-compose.sigdesk.yml up -d
#
#  Si Kong está caído, el nginx de la plataforma sigue arrancando: el
#  upstream se resuelve en cada petición (resolver de Docker + variable),
#  no al iniciar. Kong caído solo devuelve 502 en desk.sig.systems.
#  El vhost vive en docker/nginx.conf/conf.d/desk.conf (ya no inline).
# ─────────────────────────────────────────────────────────────

services:
  nginx:
    networks:
      - default      # imprescindible: de ahí se alcanza `web` (Django)
      - sig-edge
    volumes:
      # Vhost versionado en docker/nginx.conf/conf.d/desk.conf (cubierto por el
      # gate de CI de docker/nginx.conf/**).
      - ./nginx.conf/conf.d/desk.conf:/etc/nginx/conf.d/desk.conf:ro

networks:
  # Creada a mano una vez (`docker network create sig-edge`); la comparten
  # esta plataforma y el stack de SIGDesk sin acoplar sus ciclos de vida.
  sig-edge:
    external: true
    name: sig-edge
