name: Validate nginx

# Valida la config del borde con `nginx -t` antes de mergear. No despliega nada.
# Cubre: default.conf, ssl.conf (con cert autofirmado temporal) y la combinación
# default.conf + vhost de SIG-Desk (docker/nginx.conf/conf.d/desk.conf).

on:
  pull_request:
    paths:
      - "docker/nginx.conf/**"
      - "docker/docker-compose*.yml"
      - ".github/workflows/nginx-validate.yml"
  push:
    branches: [main]
    paths:
      - "docker/nginx.conf/**"
      - "docker/docker-compose*.yml"
  workflow_dispatch: {}

jobs:
  nginx-t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare inputs
        run: |
          mkdir -p /tmp/nginx-ci/certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=localhost" \
            -keyout /tmp/nginx-ci/certs/localhost.key -out /tmp/nginx-ci/certs/localhost.crt

      - name: nginx -t default.conf
        run: |
          docker run --rm -v "$PWD/docker/nginx.conf/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

      - name: nginx -t ssl.conf
        run: |
          docker run --rm -v "$PWD/docker/nginx.conf/ssl.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v /tmp/nginx-ci/certs:/etc/nginx/certs:ro \
            nginx:alpine nginx -t

      - name: nginx -t default.conf + vhost SIG-Desk
        run: |
          docker run --rm -v "$PWD/docker/nginx.conf/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/docker/nginx.conf/conf.d/desk.conf:/etc/nginx/conf.d/desk.conf:ro" \
            nginx:alpine nginx -t
